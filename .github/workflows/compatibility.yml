name: Evaluator compatibility

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rails-8-1:
    name: Rails 8.1 / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0.5'
          - '4.0.6'

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/evaluation/Gemfile.evaluation
      DATABASE_URL: postgres://postgres@localhost:5432/manyo_test
      MANYO_APP_ROOT: ${{ github.workspace }}/app
      PGTZ: UTC
      RAILS_ENV: test
      SECRET_KEY_BASE: evaluator-compatibility-test
      TZ: UTC

    steps:
      - name: Check out evaluator
        uses: actions/checkout@v7
        with:
          path: evaluation

      - name: Check out Rails starter
        uses: actions/checkout@v7
        with:
          repository: diveintocode-corp/cdp_web_manyo_task
          ref: master
          path: app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 4.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install JavaScript dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Install Ruby dependencies
        run: |
          cp app/Gemfile.lock evaluation/Gemfile.evaluation.lock
          bundle install --jobs 4 --retry 3

      - name: Verify evaluator synchronization helper
        working-directory: evaluation
        run: |
          ruby -c rails_helper.rb
          ruby -c support/system_spec_synchronization.rb
          bundle exec rspec spec/system_spec_synchronization_spec.rb

      - name: Verify Chrome and Selenium stack
        working-directory: app
        run: |
          google-chrome --version
          bundle exec ruby - <<'RUBY'
          require 'selenium-webdriver'

          minimum = Gem::Version.new('4.47.0')
          current = Gem::Version.new(Selenium::WebDriver::VERSION)
          abort("selenium-webdriver #{current} is older than #{minimum}") if current < minimum

          puts "selenium-webdriver #{current}"

          options = Selenium::WebDriver::Chrome::Options.new
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.page_load_strategy = :normal

          driver = Selenium::WebDriver.for(:chrome, options: options)
          begin
            25.times do |index|
              driver.navigate.to("data:text/html,<main id='ready'>ready-#{index}</main>")
              text = driver.find_element(id: 'ready').text
              raise "unexpected browser content: #{text}" unless text == "ready-#{index}"
            end
            puts 'Chrome/Selenium navigation smoke passed'
          ensure
            driver.quit
          end
          RUBY

      - name: Prepare test database
        working-directory: app
        run: bundle exec rails db:prepare

      - name: Load every evaluation
        working-directory: app
        run: |
          for step in step1 step2 step3 step4 step5; do
            bundle exec rspec "../evaluation/system/${step}_spec.rb" --dry-run
          done
